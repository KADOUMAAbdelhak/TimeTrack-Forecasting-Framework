# Pack-based FGCS final execution (default).
# Launch ONE pack at a time manually. Do not auto-queue packs.
# Monolithic optional plan: configs/final_fgcs_full.yaml (default_execution: false).

experiment_stage: final
execution_mode: manual_packs
default_execution: true
eligible_for_final_claims: true
evaluation_role: outer_evaluation

repository_url: https://github.com/KADOUMAAbdelhak/TimeTrack-Forecasting-Framework.git
branch: main
# Freeze identity (filled by metadata-only commit after protocol freeze commit):
#   implementation_commit = protocol logic commit
#   freeze_commit         = same protocol logic commit (non-self-referential)
#   freeze_tag            = experiment-freeze-v1
#   freeze_tag_commit     = resolved at runtime via `git rev-parse experiment-freeze-v1`
implementation_commit: 9f1bebb5d5998aab24fbffe33b048fd16b8095a6
freeze_commit: 9f1bebb5d5998aab24fbffe33b048fd16b8095a6
freeze_tag: experiment-freeze-v2

dataset_fingerprint: bf06dc0e7fe6ff5e
dependency_lock_hash: 22dca9902706473b
sampling_seconds: 42.285166
context: 32
n_outer_folds: 3

# Family-level shared hyperparameters (filled by pack 00)
shared_hyperparameters_path: results/final/packs/00_shared_tuning/selected_hyperparameters.yaml

ridge_alpha_grid: [1.0e-4, 1.0e-2, 1.0, 100.0, 1.0e4]
lightgbm_max_trials_memory: 8
lightgbm_max_trials_cpu: 8
max_required_hpo_trials: 16

dlinear_fixed:
  epochs: 40
  patience: 5
  num_threads: 1
  max_batches_per_epoch: 200
  timeout_sec: 180

efficiency_protocol:
  warmup: 1
  repeats: 3
  threads: 1

bootstrap_policy:
  method: paired_moving_block
  n_boot: 1000
  seed: 0
  acf_threshold: 0.1
  lower: 8
  upper: 256

hard_wall_clock_minutes_default: 45
stop_launching_new_runs_minutes_default: 40

artifact_root: results/final/packs

packs:
  - id: shared_tuning
    pack_dir: 00_shared_tuning
    description: Family-level Ridge grid + LightGBM shared configs + DLinear validation
    required: true
    dependencies: []
    hierarchies: [memory_um, cpu_core_weighted]
    models: [ridge, lightgbm, dlinear]
    horizons: [1]
    outer_folds: [0]
    seeds: [0]
    reconciliation_methods: []
    estimated_base_fits: 28
    estimated_recon_evals: 0
    estimated_runtime_minutes: 15
    hard_wall_clock_minutes: 45
    stop_launching_new_runs_minutes: 40
    kind: shared_tuning

  - id: memory_classical
    pack_dir: 01_memory_classical
    description: memory_um classical base + primary reconciliation
    required: true
    dependencies: [shared_tuning]
    hierarchies: [memory_um]
    models: [persistence, ridge, lightgbm]
    horizons: [1, 8, 16]
    outer_folds: [0, 1, 2]
    seeds: [0]
    reconciliation_methods: [independent, bottom_up, wls, mint]
    ablations_horizon: 8
    ablation_methods: [ols]
    nonnegative_ablation_horizon: 8
    estimated_base_fits: 216
    estimated_recon_evals: 144
    estimated_runtime_minutes: 12
    hard_wall_clock_minutes: 45
